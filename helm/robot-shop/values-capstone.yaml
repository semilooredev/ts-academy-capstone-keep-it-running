# Capstone overrides for the vendored upstream Robot Shop chart.
# Keeping these in a separate file makes the local changes easy to audit.

image:
  repo: robotshop
  version: 2.1.0
  pullPolicy: IfNotPresent

# Robot Shop's web container already exposes NGINX stub_status at
# /nginx_status. The vendored web template adds the exporter sidecar.
metrics:
  nginxExporter:
    enabled: true
    image: nginx/nginx-prometheus-exporter:1.3.0

# OpenTelemetry zero-code instrumentation for the Java shipping service.
# The vendored shipping template downloads this pinned agent JAR into a
# shared emptyDir at pod start and attaches it with JAVA_TOOL_OPTIONS.
# This is an upstream OpenTelemetry release URL — it is not Jeff's GitHub
# account and must not be rewritten to github.com/semilooredev.
otel:
  enabled: true
  collectorEndpoint: http://observability-opentelemetry-collector.monitoring.svc.cluster.local:4317
  downloaderImage: curlimages/curl:8.11.1
  javaAgentUrl: https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.10.0/opentelemetry-javaagent.jar

redis:
  # EKS normally provides gp3 in current regions; JEFF-ACTIONS.md includes a
  # storage-class check and the one-value fallback (gp2) before installation.
  storageClassName: gp3

# Keep the demo small. Individual upstream workload blocks retain their
# affinity/nodeSelector/tolerations extension points.
web: {}
cart: {}
catalogue: {}
dispatch: {}
mongodb: {}
mysql: {}
payment: {}
rabbitmq: {}
ratings: {}
shipping: {}
user: {}
