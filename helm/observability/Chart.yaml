apiVersion: v2
name: observability
description: Capstone 2 observability stack for Robot Shop - Prometheus, Grafana, Alertmanager, Loki, Fluent Bit, Jaeger and OpenTelemetry Collector
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    version: 65.5.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: 6.18.0
    repository: https://grafana.github.io/helm-charts
  - name: fluent-bit
    version: 0.48.4
    repository: https://fluent.github.io/helm-charts
  - name: jaeger
    version: 3.4.1
    repository: https://jaegertracing.github.io/helm-charts
  - name: opentelemetry-collector
    version: 0.108.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
